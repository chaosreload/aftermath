[package]
name = "aftermath"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "Scan Git repos for AI-agent footprints (abandoned branches, polluted trees, suspicious commits)"
license = "MIT"
repository = "https://github.com/chaosreload/aftermath"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
walkdir = "2"
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
